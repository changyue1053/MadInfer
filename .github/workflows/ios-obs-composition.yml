name: Isolated iOS optional observation composition
on:
  push:
    branches: [checkpoint/madinfer-ios-obs-composition]
permissions:
  contents: read
concurrency:
  group: ios-obs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  standalone-off:
    name: iOS native five optional-off
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      RUSTUP_TOOLCHAIN: 1.100.0
      CARGO_NET_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Exact original preflight
        env:
          MADINFER_EXPECTED_SHA: ${{ github.sha }}
        run: bash ci/ios-positive-preflight.sh
      - name: Original pinned tool and dependency preparation
        run: |
          bash scripts/run-preview-stage.sh apple-prerequisites bash -euo pipefail <<'STAGE'
            test "$(uname -m)" = arm64
            test "$(xcodebuild -version)" = $'Xcode 26.2\nBuild version 17C52'
            test "$(xcrun --sdk iphoneos --show-sdk-version)" = 26.2
            test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = 26.2
            test "$(cmake --version | head -n 1)" = 'cmake version 4.4.5'
            rustup toolchain install 1.100.0 --profile minimal --no-self-update
            rustup target add --toolchain 1.100.0 aarch64-apple-ios aarch64-apple-ios-sim
            CARGO_NET_OFFLINE=false cargo fetch --locked --target aarch64-apple-ios --target aarch64-apple-ios-sim
          STAGE
      - name: Build inspect and execute same five native tests
        run: bash ios-obs-composition/run.sh off
  optional-on:
    name: iOS native five optional-on
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      RUSTUP_TOOLCHAIN: 1.100.0
      CARGO_NET_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Exact original preflight
        env:
          MADINFER_EXPECTED_SHA: ${{ github.sha }}
        run: bash ci/ios-positive-preflight.sh
      - name: Original pinned tool and dependency preparation
        run: |
          bash scripts/run-preview-stage.sh apple-prerequisites bash -euo pipefail <<'STAGE'
            test "$(uname -m)" = arm64
            test "$(xcodebuild -version)" = $'Xcode 26.2\nBuild version 17C52'
            test "$(xcrun --sdk iphoneos --show-sdk-version)" = 26.2
            test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = 26.2
            test "$(cmake --version | head -n 1)" = 'cmake version 4.4.5'
            rustup toolchain install 1.100.0 --profile minimal --no-self-update
            rustup target add --toolchain 1.100.0 aarch64-apple-ios aarch64-apple-ios-sim
            CARGO_NET_OFFLINE=false cargo fetch --locked --target aarch64-apple-ios --target aarch64-apple-ios-sim
          STAGE
      - name: Public exact optional producer only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: changyue1053/MadObs
          ref: 4af77ffa464a48307e5ff2d95f10b835919d205b
          path: build/ios/obs-producer
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Build inspect and execute same five native tests
        run: bash ios-obs-composition/run.sh on
