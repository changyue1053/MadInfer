name: standalone-sdk
on:
  push:
    # This isolated no-model integration branch has its own verification workflow.
    branches-ignore: [checkpoint/madinfer-ios-native-preview]
  pull_request:
permissions:
  contents: read
jobs:
  emulated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.100.0 --component rustfmt,clippy
      - run: bash ci/verify.sh
  native:
    # Synthetic qualification must never invoke the pretrained downloader, even on a PR.
    if: >-
      ${{ !((github.event_name == 'push' && (github.ref == 'refs/heads/checkpoint/madinfer-synthetic-native' || github.ref == 'refs/heads/checkpoint/madinfer-ios-synthetic-positive' || github.ref == 'refs/heads/checkpoint/madinfer-android-native-preview' || github.ref == 'refs/heads/checkpoint/madinfer-android-app-preview')) ||
        (github.event_name == 'pull_request' && (github.head_ref == 'checkpoint/madinfer-synthetic-native' || github.head_ref == 'checkpoint/madinfer-ios-synthetic-positive' || github.head_ref == 'checkpoint/madinfer-android-native-preview' || github.head_ref == 'checkpoint/madinfer-android-app-preview'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.100.0
      - run: MADINFER_MODEL_CACHE="$PWD/target/models" bash tools/models/fetch.sh smollm2-135m-instruct-q4_k_m
      - name: Record native runner CPU capacity
        run: |
          nproc
          grep Cpus_allowed_list /proc/self/status
          for f in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/cpu/cpu.cfs_quota_us /sys/fs/cgroup/cpu/cpu.cfs_period_us; do
            if test -r "$f"; then printf '%s: ' "$f"; cat "$f"; fi
          done
      - run: MADINFER_LLAMA_MODEL="$PWD/target/models/smollm2-135m-instruct-q4_k_m.gguf" bash ci/native.sh
