madinfer-sched.workspace = true
madinfer-runtime.workspace = true
madinfer-backend.workspace = true
madinfer-config.workspace = true
madinfer-observe.workspace = true
# madai-w08 G4：结构化输出——schema → GBNF 编译 + 终态校验（preproc），逐帧 JSON Patch（serde_json 已是 workspace 依赖）。
madinfer-preproc.workspace = true
semver.workspace = true
serde_json.workspace = true

[dev-dependencies]
madinfer-testkit.workspace = true

