[package]
name = "madinfer-api"
description = "L1 能力面（设计文档 C2）。纯逻辑：Framer 合帧、请求生命周期 FSM、CapabilityIndex 能力索引；核 actor（CoreActor + WorkerPool + 请求管线，I2b）；Infer 门面随 I3 的 ffi 一并落地。"
version.workspace = true
edition.workspace = true
