I4a = { tag = "v0.12.0-mad.1", batch = "madai-w14", status = "internal", note = "I-C-12：InferCore::drop_contexts(prefix) -> u32（uniffi 新方法 + C 第 10 符号 madinfer_drop_contexts(core, madinfer_str prefix, uint32_t* out_dropped)；经 actor 邮箱在 control 线程执行、同步回条数、站停 4004）——运行时契约设计稿 R-8 / T6 核侧半边，防换账户复用前一账户上下文；ContextPool::drop_prefix + ContextPoolStats.dropped：命中键立即不可复用（同键 Reserve::Created、hits 不增），在飞条目 KV 延迟到 release（任务终态）结清、不写回；CoreActor 持池（预算 0；reserve / release 仍未接进管线）。只加符号、不改结构 / 枚举 → ABI 仍 2；madinfer.h §6 九 → 十符号（mad 镜像同批）、build_ohos.sh 期望 11 → 12；宿主 cdylib nm：madinfer_* 12、uniffi_madinfer_ffi_* 45（+fn / checksum 两符号）；294 测试。面变更（uniffi 新方法 + C 新符号）→ 0.12.0；tag 由总控合入批打" }
I4b = { tag = "v0.13.0-mad.1", batch = "madai-w15", status = "internal", note = "I-C-13：MadInfer 只加可观测面（uniffi-only，C 面十符号 / 结构 / 枚举不动 → ABI 仍 2）：InferCore::stats() -> CoreStatsRecord（context_pool_hits / dropped / entries / kv_mb / kv_budget_mb、verify_timeouts（本站）、inflight_jobs、uptime_ms；经邮箱在 control 线程一次取齐、站停 4004）；ApplyOutcomeRecord 只加 detail_kind: ApplyDetailKindRecord（None / VerifyTimeout / VerifyRejected / UnknownKey / Parse / VersionNotNewer / MinSdkUnsatisfied / OutOfRollout / Semantic——验签超时与验签假在 KMP 面分开，detail 串不变；生成绑定的 record 构造签名多一参，KMP / Swift 消费方随 I-D-14 / I-S-09 跟）；ContextPool 接进管线（Job 首次投递成功 reserve、终态 release，预算取 thresholds.kv_budget_mb[tier]，drop_prefix_keys 回键经 WorkerPool::drop_contexts 广播给 worker；估算 CoreBuilder::context_kv_mb 缺省 0）——运行时契约 T6 核侧全链在 api / uniffi 面可测（同键 hits +1、drop 后同键 Created 且 hits 不增、dropped ≥ 1）。宿主 cdylib nm 期望：uniffi_madinfer_ffi_* 45 → 47（+fn / checksum stats）、madinfer_* 12 不变；302 测试。面变更（uniffi 新方法 + record 新字段 + 新枚举）→ 0.13.0；tag 由总控合入批打；报告 Mad/madai-w15-report-i-c-13.md" }
I4c = { tag = "v0.14.0-mad.2", batch = "madai-w16", status = "internal", note = "I-C-14：上下文池后端驻留 + 调试面（uniffi-only，C 面十符号 / 结构 / 枚举不动 → ABI 仍 2）：worker 按 ContextKey 驻留 Context——池裁决随工单下发（ContextReservation：命中即复用、不再 open_context），Worker::drop_contexts 由空落地点改为 Drop 句柄（真释放后端 KV），worker 只回投事实（WorkOutcome.context_retained / evicted_contexts、ModelUnloaded 携键）让池离键，池条目 = 后端实际驻留；Backend / Model trait 只加带缺省 fn context_kv_mb(&self) -> u32 { 0 }（仿真核回 LlamaOptions.kv_per_context_mb = 8，真 llama 留 ctx 参数推算接线注），池记账取真值（Model 加载后 → Backend 加载前），CoreBuilder::context_kv_mb 退为覆盖位；预算 0（本档未配置 kv_budget_mb）→ 不进池、不驻留，宿主面要读到 context_pool_hits > 0 须先 apply 带该档预算的配置（行为变化，见报告 §7）。调试面 InferCore::debug_set_verify_deadline_ms(ms)（与 debug_set_token_delay_ms 同口径：符号两 profile 无条件导出、release 4005；上限 10 000、0 恢复 VERIFY_DEADLINE_MS、无验签器站 4001）使 detail_kind = VerifyTimeout / stats().verify_timeouts 可注入复现。宿主 cdylib nm 实测（macOS debug = release，清单 diff 空）：uniffi_madinfer_ffi_* 47 → 49（+fn / checksum debug_set_verify_deadline_ms）、UNIFFI_META_* 70 → 71、madinfer_* 12 / ffi_madinfer_ffi_* 57 不变；308 测试（基线 302，+6）、clippy 0、fmt 过、命名门 0。面变更（uniffi 新方法）→ 0.14.0；tag 由总控合入批打；报告 Mad/madai-w16-report-i-c-14.md" }
