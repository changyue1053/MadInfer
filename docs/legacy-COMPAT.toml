# MadInfer 兼容矩阵（决策 4：进 mad 班次；mad-bom.toml 的 [[sibling_repo]] name = "MadInfer" 指向本仓 tag（v<semver>-mad.<n>，同五库），本文件声明该 tag 兼容哪些契约版本）。
# CI 的 compat job 读本文件：mad 侧 capability-infer-api 的 bcv 基线版本、schema 版本、C ABI 版本三者与本仓 tag 一致才放行。

[madinfer]
version = "0.15.0"           # Cargo workspace.package.version；tag 形如 v0.6.0-mad.1（同五库 v0.1.0-mad.1 形态；MadAI 批次号记在下方 milestones）
abi_version = 2              # infer_abi_version()；宿主与核不一致时宿主拒绝加载（madai-w08：I-C-07 追加面使四结构体 sizeof 变大 → 1 → 2；madai-w14 I-C-12 只加第 10 符号不升版；madai-w15 I-C-13 / madai-w16 I-C-14 / madai-w17 I-C-16 只加 uniffi 面、C 面不动不升版）
schema_version = 1           # schemas/*.v1.json

[compat]
min_mad_bom = "2026.22"      # 最低 mad BOM 班次
infer_api_bcv = "0.1"        # capability-infer-api 公共面基线（api/capability-infer-api.api 的版本标）
kotlin = "2.2"
uniffi = "0.29"              # I3 起生效；与 Gobley 版本对齐（见 mad gradle/libs.versions.toml）

[targets]
ios = ["aarch64-apple-ios", "aarch64-apple-ios-sim"]
android = ["aarch64-linux-android"]
ohos = ["aarch64-unknown-linux-ohos"]
host = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]

[milestones]
# 每个里程碑落地时把该批的 tag 记在这里，形成可追溯的班次表。
I1 = { tag = "v0.1.0-mad.1", batch = "madai-w01", status = "internal", note = "core-types + schemas；不进 mad 生产班次" }
I2a = { tag = "v0.2.0-mad.1", batch = "madai-w02", status = "internal", note = "fsm / host / testkit / router / sched / api(纯逻辑) / config / runtime / assets / observe；无后端、无 ffi" }
I2b = { tag = "v0.3.0-mad.1", batch = "madai-w04", status = "internal", note = "madinfer-backend trait + BackendRegistry、testkit NoopBackend / FakeBackend + 契约宏、Job FSM 23 / 驻留 FSM 12 / 请求 FSM 20、api 核 actor + worker 池 + 端到端管线；仍无真实后端（llama）、无 ffi、Framer 与回调在 control 线程" }
I2c = { tag = "v0.4.0-mad.3", batch = "madai-w05", status = "internal", note = "首日契约（mad.1）：SlotClass 下沉 core-types + BackendCaps.slot（U-8）、telemetry request_end.backend / model_load.package 可选（U-9）、registry.toml 业务编号（catchup=101）、四骨架入 members。I-S-01（mad.2）：madinfer-ffi UniFFI 0.29.4 spike 判定可行——三导出桩面 + catch_unwind 收口 + deny 白名单 29 枚；符号前缀与 imcore 交集 0（nm 实测）。I-C-04（mad.3）：backend-llama 仿真核过六条契约宏 + preproc 模板/预算/SchemaCompiler→GBNF + device 识别表与档位 + assets sha256 实算与解密端口；xxh3 分桶并进 W06 E2。191 测试" }
I2d = { tag = "v0.5.0-mad.2", batch = "madai-w06", status = "internal", note = "首日契约 E2/E6：vendor 形态落地（.cargo 源替换，冷缓存 CI 可复现——I-S-01 反馈 ③ 销项）；分桶 FNV-1a → xxh3-64（xxhash-rust =0.8.18，金样五条钉读数，云侧同实现对齐）；event.v1 delta.patch 生产承诺（每帧携带 / 逐帧可应用 / seq 严格递增）。199 测试。I-CD-01（mad.2）：madinfer-ffi 真实面冻结（InferCore / HostBridge / EventSink，uniffi 0.29.4）+ Kotlin bindgen 链；203 测试" }
I3a = { tag = "v0.6.0-mad.2", batch = "madai-w07", status = "internal", note = "首日契约 F1：HostBridge.verify_ed25519 + CoreOptions.trusted_keys → BridgeVerifier（生产构建可建站，I-S-02 反馈 4003 销项）；InferCore.signal(OsSignalRecord) 资源信号入口（C16 对账表缺环）；面变更 → 0.6.0。205 测试。I-C-06（mad.2）：C ABI 八符号 Rust 实装（cabi.rs）+ madinfer.h 事实源 + AllowRemember 核侧记忆 + build_ohos.sh；227 测试" }
I3b = { tag = "v0.7.0-mad.2", batch = "madai-w08", status = "internal", note = "I-C-07：G2 apply_config（uniffi + C 第 9 符号，核发起验签端到端，ffi 4004 core_stopped）、G4 结构化输出（schema → GBNF、backend-llama Emulated 约束、逐帧 RFC 6902 structured_patch、终态校验 2003、CapabilityEntryRecord.constraint、capabilities.v1 只加 constraint）、G7（HostBridge.on_worker_started、Battery.level_pct Option、build.rs 16 KB 对齐 + feature standalone）；总控 G11：Tier::allowed_sources 上提 core-types 并进路由 / 能力索引（候选未写 tier_min 时 Unknown / Low 不许内联包，I-H-04 反馈 ②），madinfer.h §5b 行为契约注（I-H-04 反馈 ③）；四结构体 sizeof 变大 + vtable 加槽 → **abi_version 1 → 2**；面变更 → 0.7.0。总控 G12（mad.2，I-D-07 反馈 §7-2）：SchemaCompiler + validate_instance 进子集 `additionalProperties: false`（闭合对象，语法形态不变，校验判 additional_property）与原始类型联合 `type: [X, \"null\", …]`（GBNF 选择 / 任一匹配）——mad catchup SCHEMA_JSON 原文自此可编，端到端 Partial(SchemaInvalid) → Ready 的前提；WorkerClass::Delivery 标预留。258 测试。交付形态：分支 madai-w08/release + 本 tag，MadInfer main 快进与 W08 落 mad main 同刻（mad 侧按工作树 HEAD 消费同级仓的结构性问题见 madai-w08 批次记录 §4）" }
I3c = { tag = "v0.8.0-mad.1", batch = "madai-w09", status = "internal", note = "I-C-08：madinfer-host OsSignal::Battery.level_pct u8 → Option<u8>（ffi 删 100 透传，None 原样进核；sched 门控消费点 None 不参与电量门控）；WorkerClass 不拆不升 ABI，madinfer.h §5b「线程类别与 QoS」口径（Background worker → utility 档、禁 background；Async / Batch 由调度区分）；bindgen_kotlin.sh --no-format；ContextKey::new / request.v1 context 描述写死 UTF-8 字节 1～128。host 公共面类型变更 → 0.8.0；ABI 仍 2、九符号不变。263 测试。交付形态同 I3b：分支 madai-w09/release + tag，MadInfer main 快进随 Mad 首日 ⓪" }
I3d = { tag = "v0.9.0-mad.2", batch = "madai-w10", status = "internal", note = "I-C-09：madinfer.h §5 / §6 第 9 符号线程契约注（apply_config 在 control 线程经 verify_ed25519 回调宿主，禁在验签回投线程同步调）；signing_payload 规范形金样 + doc.rs 头注；signal.v1 level_pct 未知态描述；consent 专用线程走 on_worker_started(Control)；调试面 cfg(debug_assertions)：uniffi create_debug（debug_script_backend）/ test_stop_control 与 C 面 madinfer_core_create_debug / madinfer_test_stop_control（madinfer_debug.h，release 产物仍九符号 abi=2）。273 测试。交付形态同 I3b / I3c：分支 madai-w10/release + tag" }
